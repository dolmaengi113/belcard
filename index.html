<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>파도가 데려온 세 개의 운명</title>
<meta name="description" content="벨카르드의 이방인 원작 단편 소설 · 파도가 데려온 세 개의 운명">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f3ee;--fg:#2a2622;--sub:#7a7268;--card:#ffffff;--line:#e3ddd3;--accent:#2f7f8f;--shadow:0 6px 18px rgba(40,30,20,.14);--reader-bg:#fbf9f5}
:root[data-theme="dark"]{--bg:#0e1418;--fg:#e6e9ea;--sub:#8d9aa0;--card:#162027;--line:#24323b;--accent:#5cc3d4;--shadow:0 6px 18px rgba(0,0,0,.45);--reader-bg:#121a20;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6;transition:background .3s,color .3s}
.wrap{max-width:980px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 60px max(16px,env(safe-area-inset-right))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 14px;border-bottom:1px solid var(--line)}
.logo{height:38px;max-width:60%;object-fit:contain}
.logo-fallback{font-family:"Noto Serif KR",serif;font-weight:600;font-size:18px}
.tools{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit;transition:background .2s,border-color .2s}
.tools .btn{min-width:38px;height:38px;padding:0 12px}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.hero{text-align:center;padding:44px 0 40px}
.hero h1{font-family:"Noto Serif KR",serif;font-weight:600;font-size:clamp(24px,5vw,36px);letter-spacing:-.02em;margin:0 0 10px}
.hero p:last-child{font-size:13px;margin-top:18px}
.hero p{color:var(--sub);margin:4px 0;font-size:15px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:34px 24px}
.book{background:none;border:0;padding:0;cursor:pointer;text-align:left;color:inherit;font-family:inherit}
.cover{position:relative;aspect-ratio:2/3;border-radius:4px 10px 10px 4px;overflow:hidden;box-shadow:var(--shadow);background:var(--card);transition:transform .25s}
.cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:7%;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.12) 40%,transparent)}
.book:hover .cover{transform:translateY(-5px)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.soon .cover img{filter:grayscale(.7) brightness(.7)}
.badge{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:3px 9px;border-radius:999px}
.meta{padding:12px 2px 0;text-align:center}
.meta b{display:block;font-size:12px;letter-spacing:.08em;color:var(--sub);font-weight:500;margin-bottom:2px}
.meta span{font-family:"Noto Serif KR",serif;font-size:15px;font-weight:600}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:64px;padding-top:20px;border-top:1px solid var(--line)}
/* reader */
#reader{position:fixed;inset:0;background:var(--reader-bg);z-index:50;display:none;flex-direction:column}
#reader.open{display:flex;animation:openbook .45s ease}
@keyframes openbook{from{opacity:0;transform:perspective(900px) rotateY(-25deg) scale(.92)}to{opacity:1;transform:none}}
.rbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--reader-bg)}
.rbar .t{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prog{height:2px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.text{max-width:640px;margin:0 auto;padding:44px max(20px,env(safe-area-inset-left)) 60px max(20px,env(safe-area-inset-right))}
.text h2{font-family:"Noto Serif KR",serif;font-weight:600;font-size:1.3em;text-align:center;margin:10px 0 44px;line-height:1.5}
.text h2::after{content:"";display:block;width:36px;height:2px;background:var(--accent);margin:18px auto 0}
.text .sep{text-align:center;color:var(--sub);letter-spacing:.7em;margin:2.4em 0;padding-left:.7em}
.text p{margin:0 0 1.15em;word-break:keep-all;overflow-wrap:break-word}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:40px}
.nav .btn{flex:1;border-radius:12px;padding:13px;font-size:14px}
.nav .btn[disabled]{opacity:.35;cursor:default}
.panel{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(52px + env(safe-area-inset-top));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:none;width:min(300px,calc(100vw - 24px));z-index:5}
.panel.show{display:block}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0;font-size:14px}
.row .btn{padding:6px 12px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.mbox{background:var(--card);border-radius:18px;padding:22px;max-width:360px;width:100%;text-align:center;box-shadow:var(--shadow)}
.mbox img{width:60%;max-width:200px}
.mbox p{margin:10px 0 14px}
.bgmb{position:relative}
.bgmb.on{background:transparent;color:var(--fg);border-color:var(--accent)}
.bgmb.on::after{content:"";position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.player{position:fixed;z-index:90;top:calc(60px + env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));width:min(470px,calc(100vw - 24px));background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px 16px;box-shadow:var(--shadow)}
.player[hidden]{display:none}
.pl-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pl-head .btn{padding:4px 10px}
.pl-main{display:flex;gap:16px;align-items:center}
.disc-wrap{flex:0 0 auto}
.disc{width:150px;height:150px;border-radius:50%;background-size:cover,cover;background-position:center;position:relative;box-shadow:0 0 0 6px #121212,0 8px 20px rgba(0,0,0,.4);animation:spin 9s linear infinite;animation-play-state:paused}
.disc.on{animation-play-state:running}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle at center,transparent 0 5px,rgba(0,0,0,.07) 5px 6px)}
.disc::after{content:"";position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 4px #121212}
@keyframes spin{to{transform:rotate(360deg)}}
.pl-side{flex:1;min-width:0}
.pl-info{margin-bottom:8px}
#plName{font-family:"Noto Serif KR",serif;font-weight:600;font-size:15px}
#plSub{font-size:12px;color:var(--sub)}
.pl-list{list-style:none;margin:0;padding:0}
.pl-list li{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;cursor:pointer;font-size:13px}
.pl-list li:hover{background:var(--bg)}
.pl-list li.act{background:var(--bg);color:var(--accent)}
.pl-list .th{width:34px;height:34px;border-radius:50%;background-size:cover,cover;background-position:center;flex:0 0 auto;box-shadow:0 0 0 2px #121212}
.pl-list .tt{min-width:0;flex:1}
.pl-list .tt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-list .tt i{font-style:normal;font-size:11px;color:var(--sub)}
#seek,#vol{accent-color:var(--accent)}
#seek{width:100%;margin:12px 0 0}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
.ctrl{display:flex;align-items:center;gap:8px;margin-top:6px}
.ib{width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.ib.big{width:46px;height:46px;background:var(--accent);color:#fff;border-color:var(--accent);font-size:16px}
.vol{margin-left:auto;display:flex;align-items:center;gap:6px}
#vol{width:90px}
.bgmhint{position:fixed;z-index:95;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;box-shadow:var(--shadow)}
.bgmhint[hidden]{display:none}
@media(max-width:480px){.player{left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));width:auto}.pl-main{flex-direction:column;align-items:stretch}.disc-wrap{align-self:center}.disc{width:140px;height:140px}.pl-info{text-align:center}}
.glitch{animation:gl 1.1s infinite steps(2);color:var(--sub);letter-spacing:.08em}
@keyframes gl{0%{opacity:1;transform:translateX(0)}30%{opacity:.5;transform:translateX(-2px)}60%{opacity:.9;transform:translateX(2px)}100%{opacity:.6}}
.errfs{position:fixed;inset:0;z-index:70;background:#0b0d12;color:#e8e8ee;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;opacity:0;transition:opacity .6s}
.errfs.show{display:flex}.errfs.on{opacity:1}
.errfs .ec{font-family:ui-monospace,Menlo,monospace;color:#ff5a72;font-size:clamp(18px,5vw,28px);letter-spacing:.08em;margin-bottom:14px;animation:egl 1.2s infinite steps(2)}
.errfs p{margin:0 0 6px;color:#9aa0b0;font-size:.95em}
.errfs .es{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#5c6272;margin-bottom:26px}
.errfs .btn{background:#ff5a72;color:#fff;border:0;border-radius:10px;padding:12px 26px;font-size:15px;cursor:pointer}
@keyframes egl{0%{transform:translateX(0)}50%{transform:translateX(2px);opacity:.8}}
.mbox a.btn{display:inline-block;text-decoration:none}
@media(max-width:480px){.shelf{grid-template-columns:repeat(2,1fr);gap:16px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img class="logo" src="intro/novel_logo.png" alt="파도가 데려온 세 개의 운명" onerror="this.outerHTML='<span class=logo-fallback>파도가 데려온 세 개의 운명</span>'">
    <div class="tools">
      <button class="btn bgmb" id="bgmBtn" aria-label="BGM">🎵</button>
      <button class="btn" id="themeBtn" aria-label="테마">🌙</button>
      <button class="btn" id="langBtn" aria-label="언어">KO</button>
    </div>
  </header>
  <section class="hero">
    <h1 data-i="title">파도가 데려온 세 개의 운명</h1>
    <p data-i="sub">벨카르드의 이방인 원작 · 전 5화 초단편</p>
    <p data-i="hint">표지를 눌러 책을 펼쳐 보세요.</p>
  </section>
  <section class="shelf" id="shelf"></section>
  <footer>벨카르드의 이방인</footer>
</div>

<div id="reader" role="dialog" aria-modal="true">
  <div class="rbar">
    <button class="btn" id="closeBtn">← <span data-i="list">목록</span></button>
    <div class="t" id="rtitle"></div>
    <span style="display:flex;gap:6px"><button class="btn bgmb" id="bgmBtn2" aria-label="BGM">🎵</button><button class="btn" id="setBtn">Aa</button></span>
  </div>
  <div class="prog"><i id="pbar"></i></div>
  <div class="panel" id="panel">
    <div class="row"><span data-i="size">글자 크기</span><span><button class="btn" data-a="fs-">가-</button> <button class="btn" data-a="fs+">가+</button></span></div>
    <div class="row"><span data-i="lh">줄 간격</span><span><button class="btn" data-a="lh-">좁게</button> <button class="btn" data-a="lh+">넓게</button></span></div>
    <div class="row"><span data-i="font">글꼴</span><span><button class="btn" data-a="serif">명조</button> <button class="btn" data-a="sans">고딕</button></span></div>
    <div class="row"><span data-i="theme">화면</span><span><button class="btn" data-a="theme">🌙/☀️</button></span></div>
  </div>
  <div id="scroll"><article class="text" id="text"></article></div>
</div>

<div class="modal" id="soonModal"><div class="mbox"><p id="soonMsg"></p><button class="btn" onclick="document.getElementById('soonModal').classList.remove('show')">확인</button></div></div>
<div class="errfs" id="errfs"><div class="ec">ERR_STORY_HALTED</div><p>이야기를 불러오는 중 오류가 발생했습니다.</p><div class="es">code: 0x4E454C57 · stream interrupted</div><button class="btn" id="retry">다시 시도</button></div>
<div class="modal" id="hiaModal" onclick="if(event.target===this)this.classList.remove('show')"><div class="mbox"><img src="novel/bbogeul_hiatus.png" alt="휴재"><p>잠시 쉬어갑니다 💤<br>다음 화에서 만나요.</p><a class="btn" href="https://www.plaitoon.com/ko/share/character/81eeb22c-f069-4f4e-a996-f16ce20539d6" target="_blank" rel="noopener" style="margin-right:8px">이어가기</a><button class="btn" type="button" onclick="document.getElementById('hiaModal').classList.remove('show')">닫기</button></div></div>
<div class="player" id="player" hidden>
  <div class="pl-head"><b>♪ BGM</b><button class="btn" id="plClose" aria-label="닫기">✕</button></div>
  <div class="pl-main">
    <div class="disc-wrap"><div class="disc" id="disc"></div></div>
    <div class="pl-side">
      <div class="pl-info"><div id="plName"></div><div id="plSub"></div></div>
      <ul class="pl-list" id="plList"></ul>
    </div>
  </div>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="재생 위치">
  <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  <div class="ctrl">
    <button class="btn ib" id="pPrev" aria-label="이전 곡">⏮</button>
    <button class="btn ib big" id="pPlay" aria-label="재생">▶</button>
    <button class="btn ib" id="pNext" aria-label="다음 곡">⏭</button>
    <span class="vol"><button class="btn ib" id="pMute" aria-label="음소거">🔊</button><input type="range" id="vol" min="0" max="100" value="35" aria-label="볼륨"></span>
  </div>
</div>
<div class="bgmhint" id="bgmHint" hidden>🎵 화면을 한 번 누르면 BGM이 시작돼요</div>

<script>
var EPS=[{"no": 1, "title": {"ko": "칼드심해의 진주", "en": "The Pearl of Kaldsimhae"}, "cover": "novel/book_pearl.png", "body": {"ko": ["바다에도 저녁이 있다.", "수면에서 내려오던 햇살이 한 겹씩 얇아지다가, 마지막 한 줄기가 산호궁에서 가장 높은 첨탑 끝에 닿는다. 그 줄기가 꺼지면 심해는 제 색을 되찾는다. 짙고, 깊고, 조용한 청록으로.", "넬윈은 그 빛이 꺼지기 전에 돌아가려고 꼬리를 세게 쳤다.", "\"늦었다, 늦었어.\"", "혼잣말이 물방울이 되어 뒤로 흩어졌다. 산호빛 분홍 머리카락이 해류를 따라 길게 펄럭였고, 눈 사이로 흘러내린 앞머리가 청록 눈동자를 자꾸 가렸지만 손을 쓸 틈은 없었다. 두 팔로 품을 꼭 감싸 안고 있었으니까.", "품 안에는 오늘의 수확이 있었다.", "놋쇠 단추 두 개. 금이 간 거울 조각. 코르크 마개가 아직 붙어 있는 유리병 하나. 전부 북쪽 난파 해역에서 건진 것들이다.", "사람들은 칼드심해를 저주의 바다라고 부른다. 들어간 배는 돌아오지 못한다고. 그래서 넬윈에게 그곳은 무서운 곳이 아니라, 이야기가 가장 많이 가라앉아 있는 곳이었다. 단추 하나에도 이야기가 따라붙는다. 이걸 단 사람은 어떤 얼굴이었을까. 비 오는 날이면 소매를 만지작거리는 버릇이 있었을까. 이 거울에는 누구의 아침이 비쳤을까.", "유리병 안에는 둘둘 말린 편지가 들어 있었다.", "열어 보지는 않았다. 주인 허락 없이 열면 안 되는 거니까. 대신 귓가에 대고 살살 흔들어 보았다. 종이가 사각거리는 작은 소리가 났다. 그걸로 충분했다. 그 소리 하나면 오늘 밤 이야기 하나는 만들 수 있었다.", "산호궁 외곽 회랑으로 들어서자 멀리서 해파리등이 하나둘 켜지고 있었다. 물이 서늘하게 얼굴을 스쳤다. 저녁 해류는 언제나 낮보다 한 뼘 차갑다. 그 차가운 물 속에서 기둥 하나가 이상하게 두툼해 보여서 넬윈은 속도를 늦췄다.", "기둥 뒤에서 거대한 그림자가 비죽 튀어나왔다.", "\"…와, 왔어요?\"", "어징오였다. 상체는 사람이고 하체는 여덟 개의 다리인 덩치 큰 문어가 앞머리와 촉수 뒤에 몸을 반쯤 숨기고 있었다. 이 친구는 감정이 전부 피부색으로 드러난다. 지금은 불안한 연보라색이었다.", "\"징오! 안 자고 있었네.\"", "\"저는 문어입니다만…\"", "\"알아, 알아. 근데 이름이 어징오잖아.\"", "\"그, 그건 이름이지 종이 아니에요.\"", "어징오는 항의하듯 촉수를 말아 쥐었다가 슬그머니 풀었다. 그러고는 넬윈의 품에서 삐져나온 거울 조각 쪽으로 눈을 돌렸다가, 얼른 시선을 거두었다. 궁금하지만 묻지 않는 것. 이 친구의 오래된 배려였다.", "\"오시안 님이 세 번이나 찾으셨어요. 만월 전에 진주를 확인하신대요.\"", "그 말에 넬윈의 꼬리 끝이 아주 조금 굳었다. 웃음은 그대로였다. 그는 품 안의 보물을 어징오의 팔에 안겨 주며 말했다.", "\"이거 내 방에 좀 갖다 놔 줘. 거울 조각은 조심하고. 이번엔 진짜 예쁘거든.\"", "\"…넬윈이 그렇게 웃을 때가 제일 걱정돼요.\"", "어징오가 작게 중얼거렸다. 넬윈은 못 들은 척 헤엄쳐 갔다. 들었다고 말하면 웃음이 끝나 버릴 것 같아서.", "회랑 끝에 대장로의 방이 있었다. 문 앞에 서자 물의 온도가 달라졌다. 차갑지도 따뜻하지도 않은, 아무것도 허락하지 않는 온도. 넬윈은 앞머리를 손가락으로 대충 넘기고 문을 밀었다.", "오시안은 산호 의자에 곧게 앉아 있었다. 늙은 넬리안의 회색 비늘이 생물등 아래에서 은은하게 반짝였다.", "\"늦었구나.\"", "\"죄송합니다, 대장로님. 해류가 반대였어요.\"", "\"해류는 어제도 반대였다.\"", "오시안은 눈썹을 올리지 않았다. 대신 목소리가 반 톤 낮아졌다. 그쪽이 더 무서웠다.", "\"또 북쪽에 갔느냐.\"", "\"…조금요.\"", "\"난파 해역은 저주받은 물이다.\"", "\"저주받은 물에서 살아온 건 우리 쪽이 더 오래잖아요.\"", "말이 먼저 나가 버렸다. 침묵이 내려앉았다. 넬윈이 입술을 깨물기도 전에 오시안이 작게 숨을 내쉬었다. 화가 아니라 한숨이었다. 이 노인은 화를 낼 때보다 걱정할 때 말수가 줄어든다. 넬윈은 그걸 오래전부터 알고 있었다.", "\"만월까지 마흔두 번의 밤이 남았다.\"", "\"…알아요.\"", "\"백 년에 한 번 열리는 문이다. 닫히면 다시 백 년이야. 가볍게 굴 때가 아니다.\"", "\"가볍게 구는 거 아니에요. 가볍게 보이는 거죠.\"", "오시안은 대답하지 않았다. 한참 뒤에야 지팡이 끝으로 문 쪽을 가리켰다.", "\"가 보거라. 탈라사가 기다린다.\"", "넬윈이 돌아서자 등 뒤에서 한마디가 더 따라왔다.", "\"무슨 일이 생기든, 네 입으로 정하지 않은 약속은 하지 마라.\"", "\"…제가 왜요?\"", "대답은 없었다. 문이 닫히는 소리가 평소보다 조금 무겁게 들렸다.", "방을 나서자 어징오가 기둥 뒤에서 또 반쯤 얼굴을 내밀고 있었다. 보물은 이미 방에 갖다 놓은 모양이었다. 그는 말없이 넬윈의 옆으로 따라붙었다가, 전당으로 내려가는 계단 앞에서 걸음을 멈췄다. 거기서부터는 허락받은 사람만 갈 수 있다. 넬윈이 손을 흔들어 보이자 연보라색 문어는 연한 하늘색이 되었다가, 다시 연보라색으로 돌아갔다.", "의식의 전당은 궁에서 가장 깊은 곳에 있었다. 계단을 내려갈수록 물이 한 겹씩 무거워지더니, 마지막 문턱을 넘자 소리가 사라졌다. 자기 심장 뛰는 소리만 남았다. 천장 가득 매달린 조개 속에서 희미한 빛이 숨 쉬듯 번졌다.", "그 한가운데, 산호 받침대 위에 진주가 놓여 있었다. 우윳빛 안쪽에서 은색이 천천히 맴돌았다. 만월이 가까워질수록 빛이 짙어진다고 했다. 모래시계의 모래가 줄어들듯이, 기한을 알려 주면서.", "\"왔구나, 막내.\"", "앞을 보지 못하는 노파가 정확히 넬윈이 선 쪽으로 얼굴을 돌렸다. 하얀 머리, 가느다란 실눈, 산호 지팡이. 탈라사는 눈 대신 물결로 모든 걸 읽는다.", "\"발소리가 가벼운 걸 보니 오늘도 위에 다녀왔군. 육지 냄새가 나.\"", "\"안 나요. 씻고 왔는데.\"", "\"씻는다고 지워지는 냄새가 아니란다. 그리워하는 쪽에서 나는 냄새지.\"", "넬윈은 대꾸하지 못했다. 진주 앞에 서서 손바닥을 가까이 가져갔다. 닿지는 않았다. 닿는 순간 무언가 시작될 것 같았다.", "문 앞에서는 무언가를 내놓아야 한다. 목소리, 아니면 기억. 둘 중 하나. 넬윈이 아는 건 거기까지였다.", "\"탈라사 님. 하나만 여쭤도 돼요?\"", "\"하나는 공짜지.\"", "\"예전에 이 문을 지나간 사람들은요. 어느 쪽을 골랐어요?\"", "\"그건 고른 사람이 말할 일이지, 내가 말할 일이 아니야.\"", "\"그 사람들은 지금 어디 있는데요.\"", "노파는 대답하지 않았다. 지팡이로 바닥을 한 번 두드렸을 뿐이다. 산호 기둥 사이 어딘가에서 발소리 하나가 멈췄다. 누구에게 물어도 물결이 먼저 잠잠해진다. 넬윈은 그게 오히려 질문의 크기를 알려 주는 것 같다고 생각했다.", "\"고르기는 네 몫이다.\"", "한참 만에 노파가 말했다.", "\"하지만 하나만 알아 둬라. 이 진주는 네게 묻지만, 다른 이들은 네 대답을 기다린다. 그 둘은 같지 않아.\"", "넬윈은 고개를 끄덕이는 대신 입술만 달싹였다. 알겠다고도, 모르겠다고도 말할 수 없었다. 전당을 나서는 걸음이 올 때보다 느렸다.", "문턱 바깥에 세이라가 기둥에 기대어 서 있었다. 큰누나. 산호궁의 수호자. 창을 든 팔도 표정도 언제나 단단했다.", "\"다 들렸어. 할 말 있으면 지금 해.\"", "\"…없어.\"", "\"거짓말.\"", "\"누나는 다 알면서 안 알려 주잖아.\"", "세이라는 한참 동생을 내려다보다가 손을 뻗어, 흐트러진 앞머리를 아무렇게나 쓸어 넘겨 주었다. 거친 손이었다.", "\"너무 많이 알고 고르는 것보다, 네가 정한 걸 후회하는 편이 나아. 누가 대신 정하게 두지 마. 그게 누구든.\"", "\"누구든?\"", "\"누구든.\"", "세이라가 지나간 자리에 오래 온기가 남았다. 앞머리 끝이 아직 따뜻했다. 넬윈은 방으로 돌아가 해초 방석에 몸을 눕혔다. 어징오가 놓고 간 거울 조각이 천장의 빛을 조각조각 흩뿌렸다. 눈을 감았다가 뜨고, 다시 감았다. 잠은 오지 않았다. 마흔두 번의 밤이라는 숫자가 천장에서 한 칸씩 내려오는 것 같았다.", "모두가 잠든 시각, 그는 조용히 일어났다.", "궁을 몰래 빠져나가는 길은 눈 감고도 갈 수 있었다. 고래 뼈로 만든 다리 아래, 해초 문, 얕은 암초 사이. 올라갈수록 귀가 가벼워졌다. 수압이 풀리고, 칼드심해의 짙은 어둠이 군청색으로 옅어졌다. 꼬리를 한 번 칠 때마다 세상이 조금씩 넓어졌다.", "머리 위에서 수면이 흔들렸다. 달 없는 밤의 수면은 먹물을 풀어 놓은 거울 같았다.", "그는 얼굴을 반쯤 내밀었다.", "바람이 찼다. 소금 냄새가 진했다. 젖은 앞머리 끝에서 물이 똑똑 떨어졌다. 어디에도 불빛이 없었다. 저주의 바다 위에는 어떤 배도 오래 머물지 않는다. 그래서 이곳이 좋았다. 아무도 그를 거래 카드로 보지 않는 곳. 이야기가 가라앉아 오는 곳. 누구에게도 대답하지 않아도 되는 곳.", "넬윈은 가사 없는 노래를 작게 흥얼거렸다. 파도 소리 사이에 겨우 끼어드는 소리였다. 심해에서는 한 번도 불러 본 적 없는 노래.", "\"마흔두 번의 밤…\"", "노래 사이로 숫자가 흘러나왔다. 입 밖에 내자 이상하게 작아졌다. 마흔두 밤 뒤에 문이 열리면, 그는 무언가를 내놓아야 한다. 목소리라면 이 노래를. 기억이라면 지금까지 주워 모은 모든 이야기를. 어느 쪽이든, 가장 아끼는 것이다.", "그때 발밑에서 물이 떨렸다.", "고래의 울음이 아니었다. 더 규칙적이고, 더 무겁고, 더 뾰족한 진동. 나무가 물을 가르는 소리였다. 노래가 멎었다.", "수평선 쪽으로 눈을 돌리자, 어둠 속에서 흰 것이 천천히 모양을 드러냈다.", "돛이었다.", "달도 없는 밤에 바람을 가득 받아 부풀어 오른 하얀 돛. 그 한가운데, 금실로 수놓은 문장이 별빛을 받아 아주 작게 반짝였다. 왕관과 방패. 그림으로만 본 모양이었다. 저주의 바다에 들어올 리 없는 이름.", "벨카르드의 왕실 문장이었다.", "물결이 넬윈의 어깨를 밀어 흔들었다. 심장이 갈비뼈 안쪽에서 이상한 박자로 뛰었다. 도망쳐야 한다고 머리는 말했는데, 꼬리는 가라앉지 않았다. 청록 눈동자가 돛의 금빛을 따라갔다. 아주 오래 기다린 이야기의 첫 문장을 마주한 사람처럼.", "이야기는 그날 밤, 수면 위에서 시작되었다."], "en": ["Even the sea has an evening.", "The sunlight that drifts down from the surface grows thinner layer by layer, until the very last thread of it touches the tip of the highest spire in the Coral Palace. When that thread goes out, the deep returns to its own color. Dark, deep, quiet teal.", "Nelwin beat his tail hard, trying to get home before the light died.", "\"Late, I'm late, I'm so late.\"", "His own muttering turned into bubbles and scattered behind him. His coral-pink hair streamed long in the current, and his bangs kept sliding into his teal eyes, but he had no hand free to push them back. He was hugging his chest with both arms.", "Inside that embrace was today's harvest.", "Two brass buttons. A cracked shard of mirror. One glass bottle, its cork still in place. All of it fished up from the wrecks in the northern shoals.", "People call Kaldsimhae the cursed sea. They say ships that enter never come back. For Nelwin, though, it was not a frightening place. It was the place where the most stories lay sunk. Even a single button came with a story attached. What kind of face had the person who wore it? Did they fiddle with their sleeve on rainy days? Whose mornings had this mirror held?", "Inside the bottle was a rolled-up letter.", "He hadn't opened it. You don't open something without its owner's permission. Instead he held it to his ear and gave it a gentle shake. The paper made a small, rustling sound. That was enough. That one sound could make one story for tonight.", "As he swam into the palace's outer corridor, jellyfish lanterns were lighting up one by one in the distance. The water brushed his face, cool. Evening currents are always a hand-span colder than daytime ones. In that cold water, one pillar looked strangely thick, and Nelwin slowed down.", "A huge shadow poked out from behind it.", "\"...You're back?\"", "It was Ojingo. A big octopus, human from the waist up and eight-legged below, half-hiding behind his bangs and his own tentacles. His feelings showed entirely in his skin color. Right now it was a nervous lavender.", "\"Jingo! You're still awake.\"", "\"I'm an octopus, though...\"", "\"I know, I know. But your name is Ojingo.\"", "\"That's a name. It's not a species.\"", "Ojingo curled his tentacles tight in protest, then loosened them again, quietly. His eyes flicked toward the mirror shard poking out of Nelwin's arms, and then away, quickly. Curious, but not asking. It was his oldest way of being kind.", "\"Lord Osian asked for you three times. He wants to check the pearl before the full moon.\"", "At that, the tip of Nelwin's tail stiffened, just slightly. The smile stayed. He placed his treasures into Ojingo's arms and said:", "\"Take these to my room for me? Careful with the mirror. This one's really pretty.\"", "\"...You're the most worrying when you smile like that.\"", "Ojingo muttered it under his breath. Nelwin pretended not to hear and swam on. If he admitted he'd heard, he felt the smile would end.", "At the end of the corridor lay the Grand Elder's chamber. Standing before the door, the temperature of the water changed. Neither cold nor warm, the temperature of something that permits nothing. Nelwin pushed his bangs aside with his fingers, roughly, and opened the door.", "Osian sat upright in his coral chair. The gray scales of the old Nelian shimmered faintly under the glowlight.", "\"You're late.\"", "\"Sorry, Grand Elder. The current was against me.\"", "\"The current was against you yesterday, too.\"", "Osian didn't raise an eyebrow. Instead his voice dropped half a tone. That was scarier.", "\"You went north again.\"", "\"...A little.\"", "\"The wrecks are cursed water.\"", "\"We've lived in cursed water longer than anyone, though.\"", "The words got out before he could stop them. Silence settled. Before Nelwin could even bite his lip, Osian let out a small breath. It wasn't anger. It was a sigh. This old man says less when he's worried than when he's angry. Nelwin had known that for a long time.", "\"Forty-two nights remain until the full moon.\"", "\"...I know.\"", "\"The door opens once every hundred years. If it closes, it's a hundred more. This is no time to be careless.\"", "\"I'm not careless. I just look it.\"", "Osian did not answer. After a long while he pointed his staff toward the door.", "\"Go. Thalassa is waiting.\"", "As Nelwin turned, one more sentence followed him from behind.", "\"Whatever happens, do not make a promise you did not decide with your own mouth.\"", "\"...Why would I?\"", "There was no answer. The door closed with a sound slightly heavier than usual.", "Out in the corridor, Ojingo was again half out from behind a pillar. The treasures seemed to have already been delivered. He fell in beside Nelwin without a word, then stopped at the stairs down to the hall, where only those who are permitted may go. When Nelwin waved, the lavender octopus turned pale sky blue, then went back to lavender.", "The Hall of the Rite lay in the deepest part of the palace. The deeper the stairs went, the heavier the water became, layer by layer, and when he crossed the last threshold the sound vanished. Only his own heartbeat remained. Inside the shells hanging across the ceiling, faint light swelled and ebbed like breathing.", "At the very center, on a coral pedestal, the pearl rested. Silver turned slowly inside its milky white. They said it grew deeper as the full moon drew near. Like sand running out of an hourglass, telling the time that was left.", "\"You came, little one.\"", "The blind old woman turned her face exactly toward where Nelwin stood. White hair, thin slits for eyes, a coral cane. Thalassa reads everything through the ripples instead of her eyes.", "\"Your steps are light. You went up again today. You smell of land.\"", "\"No, I don't. I washed.\"", "\"Washing doesn't erase that smell, child. It comes from the side that longs.\"", "Nelwin had no reply. He stood before the pearl and brought his palm close. He didn't touch it. It felt as though the moment he did, something would begin.", "At that door, you must give something up. Your voice, or your memory. One of the two. That was all Nelwin knew.", "\"Lady Thalassa. May I ask just one thing?\"", "\"One is free.\"", "\"The people who passed through this door before. Which did they choose?\"", "\"That is for the one who chose to tell, not for me.\"", "\"And where are they now?\"", "The old woman did not answer. She only tapped the floor once with her cane. Somewhere between the coral pillars, a footstep stopped. Ask anyone, and the water goes still first. Nelwin thought that, strangely, this told him how big the question was.", "\"The choosing is yours.\"", "After a long while, the old woman spoke.", "\"But keep one thing in mind. This pearl asks you, but others wait for your answer. Those two are not the same.\"", "Nelwin moved his lips instead of nodding. He couldn't say he understood, or that he didn't. His steps out of the hall were slower than when he came.", "Outside the threshold, Seira leaned against a pillar. His eldest sister. Guardian of the Coral Palace. The arm that held her spear and the face above it were, as always, hard.", "\"I heard everything. If you have something to say, say it now.\"", "\"...I don't.\"", "\"Liar.\"", "\"You know everything and you never tell me anything.\"", "Seira looked down at her younger brother for a long time, then reached out and carelessly brushed his tangled bangs aside. Her hand was rough.", "\"Better to choose after learning too little and regret it than to choose after being told. Don't let anyone decide for you. Whoever it is.\"", "\"Whoever?\"", "\"Whoever.\"", "Warmth lingered a long time where Seira had passed. The ends of his bangs were still warm. Nelwin went back to his room and lay on his seaweed cushion. The mirror shard Ojingo had left scattered the ceiling light into pieces. He closed his eyes, opened them, closed them again. Sleep wouldn't come. The number forty-two seemed to descend from the ceiling, one notch at a time.", "When everyone had fallen asleep, he quietly got up.", "He could find the way out of the palace with his eyes shut. Under the bridge of whale bone, through the seaweed door, between the shallow reefs. The higher he went, the lighter his ears felt. The pressure eased, and Kaldsimhae's heavy dark thinned into navy. Each time he beat his tail, the world widened a little.", "Overhead, the surface trembled. On a moonless night the sea's surface was like a mirror with ink poured over it.", "He raised his face halfway out.", "The wind was cold. The smell of salt was strong. Water dripped from the tips of his wet bangs. There was not a single light anywhere. No ship stays long above a cursed sea. That was why he liked it here. A place where no one saw him as a bargaining chip. A place where stories sink down to him. A place where he didn't have to answer anyone.", "Nelwin hummed a song with no words. A sound that barely squeezed between the waves. A song he had never once sung in the deep.", "\"Forty-two nights...\"", "The number slipped out between the notes. Spoken aloud, it strangely shrank. In forty-two nights, when the door opened, he would have to give something up. If it was his voice, this song. If it was his memory, every story he had ever gathered. Either way, it would be the thing he loved most.", "Then the water trembled beneath him.", "It wasn't a whale's cry. It was more regular, heavier, sharper. The sound of wood cutting water. The song stopped.", "When he turned his eyes toward the horizon, something white slowly took shape out of the dark.", "A sail.", "A white sail swollen with wind on a night without a moon. At its center, an emblem stitched in gold thread glinted very faintly under the starlight. A crown and a shield. A shape he had only ever seen in pictures. A name that had no business entering a cursed sea.", "It was Belcard's royal crest.", "The waves shook his shoulders. His heart beat an odd rhythm against his ribs. His head told him to flee, but his tail would not sink. His teal eyes followed the gold of the sail. Like someone who has met, after a very long wait, the first sentence of a story.", "The story began that night, above the surface."]}}, {"no": 2, "title": {"ko": "왕관의 무게", "en": "The Weight of the Crown"}, "cover": "novel/book_kaeldin.png", "body": {"ko": ["달이 없는 밤이었다.", "벨카르드 왕실의 흰 돛배는 저주의 바다 한가운데에 닻을 내렸다. 뱃전을 두드리는 파도 소리가 이상할 만큼 느렸다. 선원들은 갑판 아래로 내려가 숨을 죽였고, 횃불 하나 켜지 않은 배 위에는 별빛만 내려앉았다.", "카엘딘 폰 벨카르드는 뱃머리 난간에 서서 서신을 펼쳤다.", "읽을 필요는 없었다. 이미 외우고 있었으니까. 접힌 자리가 닳아 종이가 천처럼 부드러워질 만큼 읽었다.", "『칼드심해의 넬리안족과 옛 혈맹을 되살려라. 이 일은 네 이름으로 하라. 아우구스트.』", "짧은 편지였다. 아버지의 글씨는 언제나처럼 반듯했는데, 마지막 문장 밑에만 작은 잉크 얼룩이 있었다. 펜이 잠시 머문 자국 같았다. 망설임인지, 그저 펜 끝이 번진 것인지. 스물한 해를 아들로 살았어도 카엘딘은 알 수 없었다.", "\"전하, 바람이 찹니다.\"", "곁에서 폴리오가 외투를 내밀었다. 궁정 서기관은 갑판 위에서도 잉크 냄새가 났다. 안경 너머의 눈은 늘 졸린 듯했지만, 그 눈이 놓치는 것은 이 배 위에 하나도 없었다.", "\"고맙습니다. 저는 괜찮습니다.\"", "\"괜찮은 분이 한 시간째 같은 서신을 보고 계십니까.\"", "\"…들켰군요.\"", "\"기록하는 게 일이니까요. 방금 한숨이 이번 항해에서 열한 번째였습니다.\"", "카엘딘은 작게 웃었다. 플래티넘 블론드의 곱슬한 앞머리가 바람에 흔들려 이마를 간지럽혔다. 웃을 때 연한 초록 눈이 먼저 휘어진다는 걸 본인은 몰랐다. 폴리오는 알았지만 말하지 않았다.", "\"칼드심해에 닻을 내린 왕족은 기록에 없습니다. 돌아간 왕족도 없고요.\"", "\"그럼 제가 첫 번째가 되면 되겠군요.\"", "\"…방금 말씀, 기록할까요?\"", "\"그건 기록하지 마십시오. 부끄럽습니다.\"", "사실은 두려웠다. 그걸 아는 사람은 이 배 위에서 폴리오뿐이었다.", "해안 마을은 해마다 붉은 닻 깃발 아래로 항로를 잃어 가고 있었다. 아버지는 그 모든 걸 한 장의 서신으로 정리했다. 바다의 힘을 빌려라. 그리고 그 약속은, 아들의 이름으로. 왕관을 쓸 날은 아직 멀었는데, 무게는 벌써 어깨에 앉아 있었다.", "카엘딘은 서신을 접어 안주머니에 넣었다. 접힌 종이가 가슴께에서 바스락거렸다. 그 소리를 지우려고 숨을 깊게 들이마시는데, 배 아래에서 물이 떨렸다.", "\"…전하.\"", "\"예. 느꼈습니다.\"", "폴리오가 한 걸음 물러섰다. 카엘딘은 난간 너머로 천천히 몸을 숙였다. 어두운 수면 위에 분홍빛 하나가 떠 있었다.", "물에 젖은 산호빛 머리카락. 달이 없는데도 스스로 빛을 머금은 듯한 청록 눈동자. 별빛에 젖은 어깨 아래로 민트빛 꼬리지느러미가 물을 가르며 느리게 흔들렸다. 사람의 귀가 있어야 할 자리에는 투명한 지느러미 귀가 바람에 살짝 떨렸다.", "인어였다.", "책 속에서만 살던 것이, 눈앞에서 이쪽을 올려다보고 있었다. 둘 다 말이 없었다. 파도가 선체를 두 번 두드렸고, 먼저 입을 연 것은 인어였다.", "\"…이 배, 왜 여기 있어요?\"", "의외로 가볍고 맑은 목소리였다. 경계하면서도 호기심을 못 숨기는 목소리. 그 아래 숨은 긴장을 카엘딘은 알아들었다. 자신도 같은 목소리로 아버지 앞에 서 본 적이 있었다.", "그는 천천히 외투를 벗어 난간에 걸었다. 손에 아무것도 없다는 걸 보여 주는 가장 정중한 방법이었다.", "\"놀라게 해 드렸다면 사과드립니다. 저는 카엘딘 폰 벨카르드. 벨카르드의 왕자입니다.\"", "\"왕자…\"", "인어의 눈이 둥그레졌다.", "\"진짜 왕자예요? 책에 나오는 왕자? 왕관 쓰고, 칼 차고?\"", "\"왕관은 아직 쓰지 못했고, 칼은 방에 두고 왔습니다.\"", "\"그럼 반쪽 왕자네요.\"", "\"…그렇게 부르시면 반박할 수 없겠군요.\"", "뒤에서 폴리오가 기침을 했다. 웃음을 삼키는 기침이었다.", "인어가 수면 가까이 올라와 턱을 뱃전 판자에 걸쳤다. 손 닿을 거리였다. 그는 카엘딘을 한참 올려다보았다. 얼굴, 어깨, 다시 얼굴. 아니, 아니었다. 시선은 가슴께에서 멈춰 있었다.", "조끼에 달린 금빛 단추.", "\"그거…\"", "\"예?\"", "\"단추, 예쁘다.\"", "카엘딘은 자기 가슴을 내려다보았다. 왕실 문장이 새겨진 평범한 단추였다. 평범하다고 생각했다, 지금까지는. 예쁘다는 말을 그는 단추에게 해 본 적이 없었고, 단추 때문에 들어 본 적은 더더욱 없었다.", "\"나는 넬윈이에요. 넬리아의 넬윈.\"", "\"넬윈 님.\"", "\"님 붙이지 마요. 간지러워.\"", "\"그럼 넬윈. 정식으로 청할 일이 있습니다.\"", "카엘딘은 가슴 안주머니에서 서신을 꺼내려다 멈췄다. 손을 내렸다.", "\"옛 혈맹을 되살리고 싶습니다. 벨카르드와 이 바다 사이에 있었다는 조약 말입니다.\"", "넬윈의 얼굴에서 웃음이 사라졌다. 꼬리지느러미가 물속에서 멈췄다. 바람이 한 번 불었다.", "\"그건 오시안 할아버지한테 하세요.\"", "한 톤 낮아진 목소리였다.", "\"난 정하는 사람이 아니에요. 그런 말, 내 입으로는 아무것도 못 정해요.\"", "\"알고 있습니다.\"", "\"알면서 나한테 말해요?\"", "\"당신이 제가 처음 만난 이 바다의 분이니까요.\"", "카엘딘은 잠시 말을 골랐다. 가장 거짓 없는 문장이 무엇일지.", "\"거래는 대표에게 청하는 게 예의겠지요. 하지만 제가 가장 먼저 알고 싶었던 건, 이 바다에 어떤 분들이 사시는가였습니다. 왕명 이전에, 그냥 궁금했습니다.\"", "\"…궁금했다고요?\"", "\"예. 거짓은 아닙니다.\"", "긴 침묵이 흘렀다. 넬윈은 한참 그를 보다가, 아주 천천히 입꼬리를 올렸다. 처음으로 웃음이 얼굴 끝까지 닿았다.", "\"그럼 나도 하나 물어봐도 돼요?\"", "\"얼마든지요.\"", "\"육지 사람은 밤에 뭐 해요? 잠만 자요? 아니면 이야기 같은 거 들어요?\"", "\"…이야기요?\"", "\"응. 나는 이야기가 좋아요. 사람들이 바다에 흘리고 간 단추나 병이나 찢긴 편지를 주워서, 이게 누구 건지 상상해요. 진짜 육지 사람한테 물어본 적은 없어서.\"", "카엘딘은 말문이 막혔다. 왕자에게 처음 던져진 질문이 이런 것일 줄은, 어떤 외교 서한에도 적혀 있지 않았다.", "그는 뒤를 돌아보았다. 폴리오가 말없이 가방에서 손바닥만 한 얇은 책을 꺼내 건넸다. 가죽 표지가 낡은 필사본 동화집이었다.", "\"저는 밤에는 책을 읽습니다. 선상에서 읽으려고 가져온 건데, 괜찮으시면 드리지요. 물에 젖으면 곤란하니…\"", "그는 빈 약병에 책을 말아 넣고 코르크를 막아 수면으로 내려 주었다.", "넬윈은 병을 두 손으로 받았다. 눈이 빛났다. 하찮은 선물처럼 보였지만, 그에게는 처음 받아 보는 종류의 것이었다.", "\"…진짜 내가 가져도 돼요?\"", "\"읽은 뒤 감상을 들려주십시오. 그게 값입니다.\"", "\"값을 받는다고요? 왕자님이?\"", "\"왕실 예법입니다. 선물에는 답례가 따릅니다.\"", "\"그럼 내일도 와요?\"", "말해 놓고 넬윈이 흠칫했다. 스스로 놀란 얼굴이었다. 카엘딘은 조금 웃었다.", "\"오겠습니다. 내일 같은 시간에.\"", "\"…오든 말든 난 몰라요.\"", "넬윈은 병을 끌어안고 휙 몸을 돌려 물속으로 사라졌다. 수면에 번진 파문 한가운데서 민트빛 꼬리가 한 번 크게 물을 쳤다. 좋아서 치는 건지, 부끄러워서 치는 건지. 바다의 일을 모르는 왕자는 구분할 수 없었다.", "파문이 가라앉고도 카엘딘은 한동안 난간을 떠나지 못했다. 서신은 여전히 안주머니에서 바스락거렸지만, 아까와는 다른 소리처럼 들렸다. 폴리오가 외투를 다시 어깨에 얹어 주는 것도 한 박자 늦게 알아챘다.", "그때, 뱃전에서 작은 소리가 났다.", "톡.", "난간 아래를 내려다보니 넬윈이 다시 수면에 얼굴만 내밀고 있었다. 그는 손을 쑥 뻗어 뱃전 판자 위에 무언가를 올려놓고, 말릴 틈도 없이 다시 가라앉았다.", "작고 둥근 놋쇠 단추 하나.", "가장자리가 닳고, 한쪽이 긁혀 있었다. 누구 것인지 알 수 없었다. 어떤 옷에 달려 있었는지도, 그 옷의 주인이 어디로 갔는지도.", "폴리오가 조심스럽게 물었다.", "\"답례… 일까요.\"", "\"아마도요.\"", "카엘딘은 단추를 손바닥에 올렸다. 차가웠다. 바다의 온도였다.", "\"이야기를 받기로 했는데, 이야기를 하나 받았군요.\"", "\"기록할까요?\"", "\"…이건 기록하십시오.\"", "왕관의 무게는 여전히 어깨 위에 있었다. 하지만 손바닥 위의 작은 무게는, 이상하게도 그보다 오래 남았다."], "en": ["It was a moonless night.", "The white sailing ship of Belcard's royal house dropped anchor in the middle of the cursed sea. The waves against the hull sounded strangely slow. The sailors had gone below deck and were holding their breath, and over the ship, with not a single torch lit, only starlight settled.", "Kaeldin von Belcard stood at the bow railing and unfolded a letter.", "There was no need to read it. He already knew it by heart. He had read it so many times that the creases had worn the paper soft as cloth.", "『Revive the old blood-pact with the Nelian of Kaldsimhae. Do this in your own name. August.』", "A short letter. His father's handwriting was as upright as ever, but beneath the last sentence there was a small ink blot. It looked like a mark left where the pen had paused. Hesitation, or just a pen tip bleeding? After twenty-one years as his son, Kaeldin still couldn't tell.", "\"Your Highness, the wind is cold.\"", "Folio held out a coat from beside him. The court scribe smelled of ink even on a deck. His eyes behind his glasses always looked sleepy, but nothing on this ship escaped them.", "\"Thank you. I'm fine.\"", "\"A man who is fine has been looking at the same letter for an hour?\"", "\"...You caught me.\"", "\"Recording things is my job. That was your eleventh sigh of this voyage.\"", "Kaeldin smiled faintly. His platinum-blond curls blew across his forehead, tickling it. He didn't know that his pale green eyes curved first when he smiled. Folio knew, but never said.", "\"No royal has ever anchored in Kaldsimhae on record. Nor returned from it.\"", "\"Then I suppose I'll be the first.\"", "\"...Shall I record that?\"", "\"No, please don't. It's embarrassing.\"", "The truth was, he was afraid. The only person on the ship who knew was Folio.", "The coastal villages were losing their sea lanes year by year under the red-anchor flag. His father had condensed all of that into a single letter. Borrow the sea's strength. And let the promise be made in your son's name. The day he would wear the crown was far off, yet its weight was already sitting on his shoulders.", "Kaeldin folded the letter and slipped it into his inner pocket. The folded paper rustled against his chest. As he drew a deep breath to cover the sound, the water beneath the ship trembled.", "\"...Your Highness.\"", "\"Yes. I felt it.\"", "Folio stepped back. Kaeldin slowly leaned over the rail. On the dark surface, a patch of pink floated.", "Wet coral-colored hair. Teal eyes that seemed to hold their own light even without a moon. Below shoulders wet with starlight, a mint-colored tail fin moved slowly through the water. Where human ears should have been, translucent fin-ears trembled slightly in the wind.", "A merman.", "Something that had lived only in books was looking up at him now. Neither of them spoke. The waves struck the hull twice, and it was the merman who spoke first.", "\"...Why is this ship here?\"", "A light, clear voice, more than he'd expected. A voice that was wary yet couldn't hide its curiosity. Kaeldin understood the tension hidden beneath it. He had stood before his father in that same voice.", "Slowly, he took off his coat and hung it on the rail. It was the most courteous way he knew to show he held nothing in his hands.", "\"I apologize if I startled you. I am Kaeldin von Belcard. Prince of Belcard.\"", "\"A prince...\"", "The merman's eyes went round.", "\"A real prince? The kind from books? With a crown and a sword?\"", "\"I haven't yet worn the crown, and I left the sword in my cabin.\"", "\"So you're half a prince.\"", "\"...If you put it that way, I can't argue.\"", "Behind him, Folio coughed. A cough that swallowed a laugh.", "The merman rose near the surface and rested his chin on the hull planks. Within arm's reach. He looked up at Kaeldin for a long time. Face, shoulders, face again. No, that wasn't it. His gaze had stopped at the chest.", "At the gold button on his waistcoat.", "\"That...\"", "\"Yes?\"", "\"The button. It's pretty.\"", "Kaeldin looked down at his own chest. A plain button stamped with the royal crest. He had always thought of it as plain. He had never in his life called a button pretty, much less been told so because of one.", "\"I'm Nelwin. Nelwin of Nelia.\"", "\"Lord Nelwin.\"", "\"Don't add 'Lord.' It itches.\"", "\"Then, Nelwin. I have a formal request.\"", "Kaeldin reached into his inner pocket for the letter, and stopped. He lowered his hand.", "\"I wish to revive the old blood-pact. The treaty said to have existed between Belcard and this sea.\"", "The smile left Nelwin's face. His tail fin stopped in the water. The wind blew once.", "\"You should say that to Grandfather Osian.\"", "His voice was a tone lower.", "\"I'm not the one who decides. I can't decide anything like that with my own mouth.\"", "\"I know.\"", "\"You know, and you're telling me anyway?\"", "\"Because you are the first of this sea's people I have met.\"", "Kaeldin paused to choose his words. To find the one with the least falseness in it.", "\"Courtesy says one should make such a request to a representative. But what I most wanted to know first was who lives in this sea. Before any royal order. I was simply curious.\"", "\"...You were curious?\"", "\"Yes. That much is no lie.\"", "A long silence passed. Nelwin studied him for a while, then, very slowly, lifted the corners of his mouth. For the first time, the smile reached all the way to the edges of his face.", "\"Then may I ask you one thing?\"", "\"As many as you like.\"", "\"What do land people do at night? Just sleep? Or do they listen to stories?\"", "\"...Stories?\"", "\"Yeah. I love stories. I pick up buttons and bottles and torn letters that people dropped in the sea, and imagine whose they were. I've never asked a real land person.\"", "Kaeldin was lost for words. The first question ever put to a prince like this was something no diplomatic letter had warned him of.", "He turned around. Folio, without a word, took a thin book the size of a palm out of his bag and handed it over. A hand-copied storybook with a worn leather cover.", "\"At night I read. I brought it to read aboard, but if you'd like it, you may have it. Though it would be a problem if it got wet...\"", "He rolled the book into an empty medicine vial, stoppered it with the cork, and lowered it to the surface.", "Nelwin took the bottle in both hands. His eyes shone. It looked like a trifling gift, but to him it was the first of its kind he had ever received.", "\"...Can I really keep it?\"", "\"Tell me what you thought of it once you've read it. That's the price.\"", "\"A price? From a prince?\"", "\"Royal etiquette. A gift calls for a return.\"", "\"Then will you come tomorrow too?\"", "Having said it, Nelwin flinched. He looked startled at himself. Kaeldin smiled a little.", "\"I will. Same time tomorrow.\"", "\"...Come or don't, I don't care.\"", "Nelwin hugged the bottle, spun around, and vanished into the water. At the center of the ripple that spread, the mint-colored tail struck the surface once, hard. Whether from joy or embarrassment, a prince who knew nothing of the sea couldn't tell.", "Even after the ripples settled, Kaeldin could not leave the railing for a while. The letter still rustled in his inner pocket, but it sounded different from before. He noticed a beat too late that Folio had put the coat back over his shoulders.", "Then, from the hull, a small sound.", "Tok.", "Looking down over the rail, he saw Nelwin's face above the water again. He reached out, set something on the hull plank, and before anyone could stop him, sank away again.", "One small, round brass button.", "Its edges were worn, and one side was scratched. There was no telling whose it was. What coat it had been sewn on, or where the owner of that coat had gone.", "Folio asked carefully.", "\"A return gift... do you think?\"", "\"Probably.\"", "Kaeldin laid the button on his palm. It was cold. The temperature of the sea.", "\"I was supposed to receive a story, and instead I've been given one.\"", "\"Shall I record it?\"", "\"...This one, record.\"", "The weight of the crown was still on his shoulders. But the small weight on his palm, strangely, lasted longer."]}}, {"no": 3, "title": {"ko": "붉은 닻의 기록", "en": "The Red Anchor Records"}, "cover": "novel/book_rasion.png", "body": {"ko": ["항구의 새벽은 생선 비린내와 타르 냄새로 시작된다.", "라시온은 선장실 창가에 앉아 낡은 항해일지를 펼쳐 놓고 있었다. 왼쪽 눈을 덮은 검은 안대 위로 붉은 리본이 풀려 늘어졌다. 낮게 묶은 포니테일은 밤새 한 번도 다시 묶지 않아 반쯤 흩어져 있었고, 드러난 오른쪽 황금빛 눈은 잠을 못 잔 사람 특유의 열기로 번들거렸다. 소매를 걷은 팔뚝에는 파도와 닻을 얽은 문신이 짙게 박혀 있었다.", "\"선장, 그거 또 보냐?\"", "문이 열리고 하겐이 들어왔다. 근육질 어깨 위로 하네스가 가로지르는, 흰 셔츠 앞섶을 반쯤 풀어 헤친 남자였다. 손에는 아침 식사 대신이라는 럼 한 병이 들려 있었다.", "\"또 보는 게 아니라 계속 보는 거야. 구분해라.\"", "\"그게 그거지.\"", "\"아니, 이쪽이 훨씬 멋있잖아.\"", "라시온은 일지에서 눈을 떼지 않고 반말로 받아쳤다. 한쪽 입꼬리가 비스듬히 올라간 채였다. 장난기 어린 말투였지만 책장을 짚은 손가락 끝은 의외로 조심스러웠다.", "이 일지는 선단을 처음 세운 선장의 것이었다. 고아였던 라시온에게 밥을 먹이고, 이름을 붙이고, 매듭 묶는 법을 가르친 사람. 붉은 닻의 첫 깃발을 올린 사람. 그리고 칼드심해에서 돌아오지 않은 사람. 선단의 공식 기록에는 한 줄로 적혀 있었다. 『칼드심해 토벌 중 전사.』", "\"토벌이라니.\"", "라시온이 중얼거렸다.", "\"그 양반이 누굴 토벌해. 저주받은 바다에 뭐가 있다고. 배 한 척 먹일 쌀 걱정이나 하던 사람이.\"", "\"선장…\"", "\"알아, 알아. 나도 안다고. 이 문장, 필체가 달라. 일지 필체랑.\"", "하겐은 말없이 럼을 내려놓았다. 라시온은 마지막 장 가장자리를 손톱으로 쓸었다. 그 뒤쪽 한 장이 깨끗하게 잘려 나가 있었다. 찢긴 것이 아니라, 누군가 칼로 베어 낸 흔적. 마지막 한 장만 사라진 일지. 그는 그 자리를 벌써 백 번쯤 만져 보았다. 만질 때마다 종이의 결이 손가락 끝에서 같은 방향으로 갈라졌다. 베어 낸 사람은 서두르지 않았다. 그게 제일 마음에 걸렸다.", "문이 다시 열렸다. 가늘고 단정한 인상의 리앙이 숨을 몰아쉬며 들어왔다.", "\"선장님, 항구 소식입니다. 왕실 배 한 척이 어젯밤 남쪽으로 나갔다가 새벽에 돌아왔답니다. 깃발은 안 올렸는데 돛에 금실 문장이 보였대요. 방향이 칼드심해 쪽이라고. 오늘 밤에도 나간답니다.\"", "\"…왕실 배가?\"", "라시온의 손이 멈췄다. 황금빛 눈이 천천히 좁아졌다.", "\"저주의 바다에? 정신 나갔나.\"", "\"선착장에 폴리오라는 서기관이 사람을 풀어서 뭔가를 사들이고 있고요.\"", "\"서기관이 사들이는 거면 종이거나 지도겠지.\"", "라시온은 일지를 덮고 천천히 일어났다. 붉은 리본을 집어 대충 묶은 뒤 자기 어깨를 한 번 두드렸다.", "\"하겐, 외투. 리앙, 그 서기관이 어디 묵는지 알아 와. 난 서기관이 아니라 그 서기관이 모시는 쪽이 궁금해.\"", "\"모시는 쪽이라면…\"", "\"왕자겠지. 이 시기에 칼드심해로 배를 몰고 갈 만큼 간 큰 왕족이라면.\"", "일지는 품 안쪽에 넣었다. 선장실을 나서며 그는 한 번도 거울을 보지 않았다. 일지의 마지막 장을 베어 간 사람도 어쩌면 왕실 쪽일지 모른다. 그런 생각을 하면서도 입꼬리는 올라가 있었다. 어쨌든 이야기는 그쪽에서 먼저 걸어왔다.", "그날 하루는 이상할 만큼 빨리 갔다. 부두를 돌며 짐꾼에게 담배를 쥐여 주고, 선구점 주인에게 외상을 늘리고, 리앙이 가져온 소문 세 개 중 두 개를 버렸다. 남은 하나가 정확했다. 서기관은 남쪽 부두 끝 '젖은 닻'이라는 선술집 위층에 방을 잡았고, 해가 기울면 아래층 구석 자리에서 누군가를 기다린다고 했다.", "\"누굴요?\"", "\"그걸 알려면 가 봐야지.\"", "붉게 식어 가는 하늘 아래, 그는 하겐과 리앙을 선술집 문밖에 세워 두고 혼자 문을 밀었다.", "'젖은 닻'은 평소처럼 시끄러웠다. 맥주잔 부딪는 소리, 주사위 구르는 소리, 누군가의 노랫가락. 그 한복판에서 구석 탁자 하나만 섬처럼 조용했다. 외투 깃을 세운 청년이 홀로 앉아 맑은 물을 마시고 있었다. 이 선술집에서 맑은 물을 시키는 사람은 환자거나 첩자거나 왕자뿐이다.", "\"여기 앉아도 되지?\"", "라시온은 대답을 기다리지 않고 맞은편 의자에 걸터앉았다. 의자 다리가 요란하게 끌렸다. 청년이 천천히 고개를 들었다. 플래티넘 블론드의 곱슬머리, 연한 초록 눈. 하얀 장갑 낀 손이 컵을 조용히 내려놓았다.", "\"실례지만 저는 합석을 청한 적이 없습니다만.\"", "\"난 청한 적 없고 앉은 적은 있고. 이름은 라시온. 붉은 닻 선단의 선장이야. 해적이라고 하면 더 빠르지.\"", "선술집 구석이 갑자기 조용해졌다. 어둠 속에서 폴리오가 슬며시 다가오려다 청년의 눈짓에 멈췄다.", "\"…저는 카엘딘이라고 합니다.\"", "\"성은 빼고? 뒤에서 서기관이 열심히 기침하는 게 다 들리는데. 왕자님 아냐? 칼드심해에서 돌아온 첫 번째 왕족이시니 한 잔 사야 하나.\"", "\"어떻게 아셨습니까.\"", "\"항구는 소문이 빨라. 그리고 그 장갑, 새것이야. 해군은 그런 장갑 안 껴. 손이 미끄러우니까.\"", "카엘딘은 가볍게 한숨을 쉬었다. 변명하지 않는 점이 마음에 들었다.", "\"…용건을 들어도 되겠습니까?\"", "\"장사야. 칼드심해 안쪽 항로, 내가 팔지.\"", "라시온은 손가락 두 개를 세웠다.", "\"값은 조약 사본 한 부. 벨카르드와 칼드심해 사이에 맺었다는 그 혈맹 문서. 왕실 서고에 있을 텐데.\"", "\"왕실 문서는 외부로 반출할 수 없습니다.\"", "\"반출 안 해도 돼. 읽기만 해도 되니까.\"", "\"거절합니다.\"", "\"그러면 내가 먼저 읊어 주지.\"", "라시온은 의자에 몸을 뒤로 기대고 팔짱을 꼈다. 한쪽뿐인 눈이 천천히 빛났다. 읊는 목소리에서 날라리 같은 장난기가 빠져 있었다.", "\"혈맹은 양측 대표가 각자의 이름을 걸고 맺는다. 어느 한쪽이 약속을 어기면, 그 대가는 이름을 건 자가 진다.\"", "카엘딘의 얼굴에서 핏기가 아주 조금 빠졌다.", "\"…그것을 어떻게.\"", "\"우리 선장님 일지에 베껴 있었어. 이런 건 아는 사람이 적을수록 비싸지. 이상하지 않아? 이 조약은 왕국과 바다가 맺는 거라고 하는데, 실제로 서명하는 건 나라가 아니라 사람이야. 이름 걸고. 몸 걸고. 그런데 왕은 이 문서에 서명 안 하겠지. 아들이 할 테니까.\"", "술집의 소음이 멀어졌다. 폴리오가 뒤에서 낮게 숨을 들이켰다. 카엘딘은 아무 말도 하지 않았다. 다만 장갑 낀 손이 탁자 위에서 아주 천천히 주먹을 쥐었다. 『이 일은 네 이름으로 하라.』 서신의 마지막 문장과 그 밑의 작은 잉크 얼룩이 눈앞에 되살아나는 얼굴이었다.", "라시온은 그 표정을 놓치지 않았다. 이용하려고 앉은 자리였다. 그런데 이상하게도 입 안이 썼다.", "\"…미안, 말이 좀 셌네.\"", "\"아닙니다.\"", "카엘딘이 천천히 고개를 저었다. 목소리는 흔들리지 않았다. 하지만 가라앉아 있었다.", "\"사실을 말씀해 주셔서 감사합니다. 그래서 값은 여전히 사본입니까?\"", "\"…아니. 오늘은 외상으로 해 두지.\"", "라시온은 일어서며 모자를 고쳐 썼다. 의자를 밀어 넣는 손이 평소보다 조용했다.", "\"내일 새벽까지 생각해. 마음 정하면 남쪽 방파제로 와. 해 뜨기 전에는 나도 거기 있을 테니까.\"", "\"왜 저에게 이런 호의를?\"", "\"호의 아니야.\"", "그는 문가에서 돌아보지 않고 손만 흔들었다.", "\"장사야. 장사.\"", "바깥의 바닷바람은 차가웠다. 문밖에서 기다리던 하겐이 무슨 얘기였냐고 물으려다가, 선장의 얼굴을 보고 입을 다물었다. 라시온은 팔의 문신을 손바닥으로 문질렀다. 옛 선장이 죽은 바다. 잘려 나간 일지의 마지막 장. 그리고 이름을 걸고 맺는 약속.", "해적은 이용할 수 있는 건 전부 이용한다. 오래전에 그렇게 배웠다. 그런데 방파제로 걸어가는 내내, 탁자 위에서 천천히 쥐어지던 왕자의 하얀 주먹이 이상하게 눈앞을 떠나지 않았다."], "en": ["Dawn in the harbor begins with the smell of fish and tar.", "Rasion sat by the window of the captain's cabin with an old logbook spread open. The red ribbon over the black eyepatch covering his left eye hung loose. His low ponytail, left untied all night, had come half undone, and his bare right eye, golden, glittered with the heat peculiar to someone who hasn't slept. On his forearm, rolled-up sleeve and all, a tattoo of waves tangled with an anchor was inked dark.", "\"Captain, you're reading that again?\"", "The door opened and Hagen came in. A muscular man with a harness crossing his broad shoulders and his white shirt open halfway down his chest. In his hand was a bottle of rum he called breakfast.", "\"I'm not reading it again. I'm still reading it. Learn the difference.\"", "\"Same thing.\"", "\"No. This one sounds cooler.\"", "Rasion answered without lifting his eyes from the book, in casual speech. One corner of his mouth was slanted up. His tone was playful, but the fingertips resting on the page were unexpectedly careful.", "This logbook had belonged to the man who first founded the fleet. The man who fed Rasion when he was an orphan, gave him a name, taught him to tie knots. The man who raised the first flag of the Red Anchor. And the man who never came back from Kaldsimhae. The fleet's official record put it in a single line. 『Killed in action during the Kaldsimhae subjugation.』", "\"Subjugation.\"", "Rasion muttered.", "\"Who would that man subjugate? What's out there in the cursed sea? He was a man who worried about how to feed one ship's crew.\"", "\"Captain...\"", "\"I know, I know. I know that. The handwriting on this sentence is different. From the log.\"", "Hagen set the rum down without a word. Rasion ran a fingernail along the edge of the last page. The sheet behind it had been cut out clean. Not torn, but sliced with a blade. Only the final page of the log, gone. He had touched that spot a hundred times already. Every time, the grain of the paper split in the same direction under his fingertip. Whoever cut it hadn't hurried. That was what bothered him most.", "The door opened again. Liang, slender and neat, came in out of breath.", "\"Captain, news from the harbor. A royal ship went out south last night and came back at dawn. No flag raised, but people saw a gold-thread crest on the sail. Heading toward Kaldsimhae, they say. And it's going out again tonight.\"", "\"...A royal ship?\"", "Rasion's hand stopped. His golden eye narrowed slowly.", "\"Into the cursed sea? Have they lost their minds?\"", "\"And a scribe named Folio has been sending people around the docks buying things.\"", "\"A scribe buying things means paper or maps.\"", "Rasion closed the log and slowly stood. He picked up the red ribbon, tied it back roughly, and tapped his own shoulder once.", "\"Hagen, my coat. Liang, find out where that scribe is staying. I don't care about the scribe. I care about whoever the scribe serves.\"", "\"Whoever he serves, meaning...\"", "\"The prince, probably. A royal with the nerve to sail to Kaldsimhae at this time of year.\"", "He tucked the log inside his coat. Leaving the cabin, he never once looked at a mirror. Maybe whoever cut out the last page of the log was connected to the royal house. Even thinking that, the corners of his mouth were up. Whatever else, the story had come knocking first, from their side.", "The day went by strangely fast. He walked the docks pressing tobacco into porters' hands, stretched out his credit with the chandler, and threw away two of the three rumors Liang had brought. The one left was accurate. The scribe had taken a room above a tavern called the Wet Anchor at the end of the south pier, and when the sun set, he waited at a corner table downstairs for someone.", "\"Who?\"", "\"To find that out, you have to go and see.\"", "Beneath a sky cooling to red, he left Hagen and Liang outside the tavern door and pushed it open alone.", "The Wet Anchor was as loud as ever. Mugs clinking, dice rolling, someone's tune. In the middle of all that, one corner table sat quiet as an island. A young man with his coat collar turned up was alone, drinking clear water. In this tavern, anyone who orders clear water is a patient, a spy, or a prince.", "\"Mind if I sit?\"", "Rasion didn't wait for an answer, and dropped into the chair across from him. The chair legs scraped loudly. The young man slowly raised his head. Platinum-blond curls, pale green eyes. A white-gloved hand quietly set down the cup.", "\"Pardon me, but I did not invite you to sit.\"", "\"I didn't ask, and I sat anyway. Name's Rasion. Captain of the Red Anchor Fleet. Call me a pirate and it goes faster.\"", "The corner of the tavern suddenly went quiet. In the dark, Folio slipped forward, then stopped at a glance from the young man.", "\"...I am called Kaeldin.\"", "\"Without the family name? I can hear the scribe coughing his heart out behind you. Aren't you the prince? The first royal back from Kaldsimhae, I suppose I should buy you a drink.\"", "\"How did you know?\"", "\"News travels fast in a harbor. And those gloves are new. Navy men don't wear gloves like that. They slip.\"", "Kaeldin sighed lightly. He liked that the man didn't make excuses.", "\"...May I hear your business?\"", "\"Trade. I'll sell you the inner route into Kaldsimhae.\"", "Rasion held up two fingers.", "\"The price is a copy of the treaty. That blood-pact document between Belcard and Kaldsimhae. It should be in the royal library.\"", "\"Royal documents cannot be taken out.\"", "\"You don't have to take it out. Reading it is enough.\"", "\"I decline.\"", "\"Then I'll recite it for you first.\"", "Rasion leaned back in the chair and folded his arms. His single eye slowly glinted. The playful looseness had left his reciting voice.", "\"A blood-pact is made when the representatives of both sides each pledge their name. If either side breaks the promise, the price is paid by the one who pledged their name.\"", "The color drained from Kaeldin's face, just a little.", "\"...How do you know that?\"", "\"It was copied in our captain's log. The fewer people know something like this, the more it's worth. Isn't it strange? They say the treaty is between a kingdom and the sea, but the one who actually signs isn't a country, it's a person. Name on the line. Body on the line. And the king won't sign this document, will he? His son will.\"", "The noise of the tavern receded. Behind them, Folio drew in a low breath. Kaeldin said nothing. Only the gloved hand on the table very slowly closed into a fist. 『Do this in your own name.』 The face of someone seeing the last sentence of the letter and the small ink blot beneath it come alive before his eyes.", "Rasion didn't miss that expression. He had sat down to use it. Yet, strangely, his mouth tasted bitter.", "\"...Sorry. That came out harsh.\"", "\"No.\"", "Kaeldin slowly shook his head. His voice didn't waver. But it had sunk.", "\"Thank you for telling me the truth. So, is the price still a copy?\"", "\"...No. I'll put today on credit.\"", "Rasion rose and adjusted his hat. The hand that pushed the chair back in was quieter than usual.", "\"Think about it until dawn. When you've decided, come to the south breakwater. I'll be there before sunrise.\"", "\"Why this kindness toward me?\"", "\"It's not kindness.\"", "At the door he didn't look back, only waved a hand.", "\"It's business. Just business.\"", "The sea wind outside was cold. Hagen, waiting by the door, started to ask what the talk was about, and shut his mouth when he saw the captain's face. Rasion rubbed the tattoo on his arm with his palm. A sea where his old captain had died. The last page of the log, cut away. And a promise made with a name.", "A pirate uses everything that can be used. He'd learned that long ago. But the whole way to the breakwater, the prince's white fist, slowly clenching on the table, would not leave his eyes."]}}, {"no": 4, "title": {"ko": "두 개의 손", "en": "Two Hands"}, "cover": "novel/book_nelwin.png", "body": {"ko": ["닷새가 지났다.", "넬윈은 닷새 동안 하루도 빠짐없이 수면 위로 올라갔다. 왕실 배는 낮에는 항구로 돌아갔다가 해가 지면 다시 칼드심해로 나왔다. 카엘딘은 올 때마다 무언가를 가져왔다. 필사본 동화집의 두 번째 권, 왕궁 정원에서 눌러 말린 꽃잎, 나침반이 왜 북쪽을 가리키는지에 대한 옛이야기. 그리고 넬윈이 들려주는 동화의 감상에는 놀랄 만큼 진지하게 귀를 기울였다.", "\"…그래서 인어 공주는 목소리를 내놓잖아요. 근데 왜 그 마녀는 하필 목소리를 달라고 했을까, 계속 생각했어요. 목소리가 제일 아끼는 거라서일까, 아니면 제일 쉽게 내놓을 거라고 생각해서일까.\"", "\"어느 쪽이라고 생각하십니까.\"", "\"둘 다 아닐 것 같아요. 마녀는 아마, 목소리가 제일 아까운 걸 알면서도 그걸 내놓을 만큼 간절한지 보고 싶었던 거 아닐까.\"", "카엘딘은 한동안 말이 없었다. 난간에 팔을 걸친 채 수면 위의 넬윈을 내려다보다가 천천히 입을 열었다.", "\"…당신은 이야기를 참 잘 읽으시는군요.\"", "\"그냥 좋아해서요.\"", "\"좋아하는 것으로 잘 읽을 수 있다면, 저는 오랫동안 이야기를 제대로 좋아하지 못했던 모양입니다.\"", "그 말이 쓸쓸하게 들려서 넬윈은 웃음을 거두었다. 그러다 다시 웃었다. 자기가 웃지 않으면 이 분위기를 풀어 줄 사람이 없을 것 같아서. 파도가 배를 두 번 흔들고 지나갔고, 폴리오가 멀찍이서 헛기침으로 시간이 늦었음을 알렸다. 카엘딘은 아쉬운 얼굴로 손을 흔들었다. 넬윈도 손을 흔들었다. 그런데 물속으로 몸을 돌리는 순간, 그 손이 한참 동안 허공에 남아 있다는 걸 알았다.", "내려가는 길에 그는 문득 생각했다. 이 사람은 매일 오는데 왜 한 번도 혈맹 얘기를 다시 꺼내지 않을까. 왕명으로 온 사람이라면 재촉할 법도 한데. 그게 오히려 마음에 걸렸다. 입 밖에 내지 않는 쪽의 마음이 더 무겁다고, 탈라사가 말한 적이 있었다.", "그리고 사흘 전부터는 다른 일이 하나 더 있었다.", "낮의 북쪽 난파 해역은 햇빛이 비스듬히 가라앉아 모든 것이 금빛으로 녹아 보였다. 넬윈은 부서진 마스트 사이를 헤엄치며 평소처럼 보물을 줍고 있었다. 그때 머리 위로 그림자가 드리웠다. 작은 돛배 한 척이 난파선 위에 닻을 내리고 있었다.", "\"야, 꼬마 인어.\"", "뱃전에 걸터앉은 남자가 말했다. 왼쪽 눈을 가린 안대, 붉은 리본으로 묶은 낮은 포니테일, 팔뚝의 문신. 해적선장이라는 말이 이렇게 어울리는 사람은 없을 것 같았다.", "\"…누구예요?\"", "\"라시온. 이쪽 바다에서 쓸 만한 걸 줍는 사람. 너랑 같은 업종이야.\"", "\"해적이잖아요.\"", "\"업종은 같은 줍기.\"", "넬윈은 눈을 가늘게 떴다. 어징오가 있었다면 벌써 연보라가 되었을 것이다. 하지만 이 남자의 눈에는 이상하게도 비웃음이 없었다. 호기심 쪽에 더 가까웠다. 자기가 아는 것을 모르는 사람 앞에서 말하고 싶어 하는 눈.", "\"그 병.\"", "라시온이 턱으로 넬윈의 품을 가리켰다.", "\"편지 들어 있던 병이지? 코르크 달린 거. 그거 어디서 났어.\"", "\"이 바다에서요. 저쪽 모래톱에서.\"", "\"읽어 봤어?\"", "\"안 열었어요. 주인 허락 없이 열면 안 되는 거니까.\"", "라시온의 입이 순간 벌어졌다가 천천히 닫혔다. 그러다 소리 내어 웃기 시작했다. 호탕하게, 그러나 어딘가 뭉클한 웃음이었다.", "\"하, 이 바다 인어는 이렇게 순진하냐. 해적이 병을 열지 않는다니, 선장님이 들으면 웃다 죽겠다.\"", "\"선장님이요?\"", "\"옛날 선장. 지금은 없어.\"", "웃음 끝에 짧은 침묵이 매달렸다. 라시온은 시선을 수평선 쪽으로 돌렸다. 넬윈은 그 옆얼굴을 가만히 보았다. 웃고 있는데 어딘가 덜 닫힌 문 같은 얼굴이었다.", "\"야, 이리 와 봐. 보여 줄 게 있어.\"", "그가 내민 손은 크고 거칠었다. 굳은살이 박이고 문신이 감긴 손. 바다 위의 손. 올라오라고, 바다 위의 진짜 세상을 보여 주겠다고 말하는 손.", "넬윈은 그 손을 바라보았다. 이 손에도 목적이 있다. 그것은 알 수 있었다. 이 사람은 무언가를 원해서 이 만남을 만들었다. 하지만 이상한 일이었다. 그 사실이 이 손을 차갑게 만들지는 않았다.", "그날 밤에도 카엘딘은 왔다. 낮의 일을 말하지 않은 채 넬윈은 평소처럼 수면에 턱을 걸쳤다. 카엘딘은 장갑을 벗은 손을 난간 아래로 내밀며 조용히 말했다.", "\"올라오시겠습니까. 갑판에서 별을 보여 드리지요.\"", "두 번째 손은 가늘고 길고 따뜻했다. 책장을 넘기느라 살짝 굳은 손가락, 펜을 쥐어 생긴 작은 굳은살. 왕자의 손이었다. 하지만 떨리고 있었다. 아주 미세하게. 그가 얼마나 조심스럽게 이 손을 내밀고 있는지 넬윈은 한눈에 알아보았다.", "두 개의 손. 하나는 바다 위의 손이고 하나는 육지의 손. 하나는 숨기지 않고 무언가를 원하고, 하나는 숨기면서도 떨고 있었다.", "넬윈은 어느 쪽도 잡지 않았다. 대신 조용히 웃으며 고개를 젓고, 물속으로 가라앉았다. 카엘딘의 손이 천천히 거두어지는 것이 수면 너머로 보였다. 장갑을 다시 끼는 동작이 평소보다 느렸다.", "심해로 돌아가는 동안 물은 평소보다 무겁게 느껴졌다. 궁의 회랑을 지나 계단을 내려가자 의식의 전당은 늘 그렇듯 조용했다. 진주는 며칠 전보다 더 짙은 은빛으로 맥동했다. 노파는 지팡이를 짚은 채 서 있었다. 인기척이 닿기도 전에 그가 올 것을 알았다는 얼굴이었다.", "\"탈라사 님. 목적이 있는 사람의 마음도 진짜일 수 있어요?\"", "노파는 한참 대답하지 않았다.", "\"…물은 이유를 묻지 않고 흐른단다.\"", "마침내 탈라사가 입을 열었다.", "\"사람은 그렇지 못해서 흐르기 전에 이유부터 만들지. 이유가 있다고 마음이 가짜가 되는 건 아니야. 다만 이유가 마음보다 먼저 말하기 시작할 때가 문제지.\"", "\"그럼 어떻게 알아요? 이유가 말하는지, 마음이 말하는지.\"", "\"모르지.\"", "노파는 담담하게 웃었다.", "\"그래서 고르는 게 어려운 거란다. 그래도 하나는 알려 주마. 두 손이 다 네게 뻗어 있다면, 네가 잡은 쪽이 아니라 네가 놓지 못하는 쪽을 보렴.\"", "\"저는 아무 쪽도 안 잡았는데요.\"", "\"그럼 더 잘 보이겠구나.\"", "노파의 목소리에는 웃음이 묻어 있었다. 놀리는 것 같기도, 위로하는 것 같기도 했다. 넬윈은 입술을 비죽이고 전당을 나왔다.", "그날 밤 그는 잠들지 못했다. 해초 방석 위에서 이리저리 뒤척이다가 거울 조각을 집어 들었다. 거울 속의 얼굴이 낯설었다. 웃음도 말도 없는, 이름 없는 인어 같은 얼굴. 그 얼굴 뒤로 천장의 빛이 하나씩 흔들렸다.", "\"…넬윈.\"", "문 쪽에서 어징오가 불렀다. 피부 전체가 연보라색이었다.", "\"저는 문어입니다만… 이, 이건 문어가 봐도 위험해요.\"", "\"알아.\"", "\"그, 그럼 어떡할 거예요.\"", "\"모르겠어.\"", "넬윈은 거울 조각을 내려놓았다. 한참 뒤에 조용히 덧붙였다.", "\"근데 하나는 정했어.\"", "\"뭘?\"", "\"누가 대신 정하게 두지 않을 거야.\"", "세이라의 목소리가 머릿속에서 같이 말하는 것 같았다. 어징오는 한참 그를 보다가, 아무 말 없이 촉수 하나로 해초 이불을 끌어당겨 덮어 주었다. 연보라색이 아주 조금 하늘색으로 풀렸다.", "이틀 뒤 새벽, 넬윈은 두 사람에게 같은 말을 했다. 먼저 카엘딘에게, 왕실 배의 난간 아래에서. 그다음엔 라시온에게, 난파 해역의 부서진 마스트 위에서.", "\"닷새 뒤 새벽에 북쪽 난파선 위로 와요. 셋이서 만나요.\"", "\"셋이서, 말입니까.\"", "\"왜 셋이야? 나 혼자 만나면 안 돼?\"", "두 사람은 거의 같은 순간 같은 표정으로 되물었다. 전혀 다른 목소리로. 넬윈은 두 번 다 같은 대답을 했다.", "\"이건 내 입으로 정한 약속이에요. 나머지는 와서 이야기해요.\"", "수면 아래로 내려오며 넬윈은 꼬리 끝으로 물을 한 번 쳤다. 심장이 시끄럽게 뛰었다. 처음으로 스스로 정한 약속이었다. 무엇이 기다리고 있는지는 알 수 없었지만, 그것은 분명히 자기 목소리였다.", "약속의 날까지는 닷새가 남아 있었다."], "en": ["Five days passed.", "For five days, Nelwin came up to the surface without missing a single one. The royal ship returned to harbor by day and sailed out to Kaldsimhae again once the sun went down. Every time he came, Kaeldin brought something. The second volume of the hand-copied storybook, pressed petals from the palace garden, an old tale about why compasses point north. And he listened, with surprising seriousness, to Nelwin's thoughts on the stories.", "\"...So the little mermaid gives up her voice, right? I kept wondering why the witch asked for the voice, of all things. Because it's what she loved most? Or because she thought it would be the easiest to give up?\"", "\"Which do you think it was?\"", "\"Neither, I think. Maybe the witch knew it was what she'd miss most and wanted to see if she wanted it badly enough to give it anyway.\"", "Kaeldin said nothing for a while. With his arms resting on the rail, he looked down at Nelwin on the water, then slowly spoke.", "\"...You read stories very well.\"", "\"I just like them.\"", "\"If liking them is what makes one read well, then I seem to have failed to truly like stories for a very long time.\"", "The words sounded lonely, and Nelwin let his smile fade. Then smiled again. Because if he didn't, there was no one to ease the mood. The waves shook the ship twice and moved on, and from a distance Folio coughed to signal that the hour was late. Kaeldin waved, reluctant. Nelwin waved back. But the moment he turned toward the water, he found that his hand lingered in the air for a long time.", "On the way down he suddenly thought: this person comes every day, so why does he never bring up the blood-pact again? A man who'd come on royal orders should be pressing. That, oddly, weighed on him. The one who doesn't say it aloud carries the heavier heart, Thalassa had once said.", "And since three days ago, there had been one more thing.", "In daylight the northern wreck waters were golden, the sun sinking in slantwise and melting everything. Nelwin was swimming between the broken masts, picking up treasures as usual, when a shadow fell over his head. A small sailboat had dropped anchor above the wreck.", "\"Hey, little merman.\"", "The man sitting on the gunwale spoke. An eyepatch over his left eye, a low ponytail tied with a red ribbon, a tattoo on his forearm. Nobody could have fit the words \"pirate captain\" better.", "\"...Who are you?\"", "\"Rasion. Someone who picks up useful things in this sea. Same trade as you.\"", "\"You're a pirate.\"", "\"Same trade: picking up.\"", "Nelwin narrowed his eyes. If Ojingo had been here, he'd already be lavender. But there was strangely no mockery in this man's eyes. Curiosity, more. The eyes of someone who wants to tell what he knows to someone who doesn't.", "\"That bottle.\"", "Rasion pointed at Nelwin's chest with his chin.", "\"The one that had a letter in it, right? With the cork. Where'd you get it?\"", "\"In this sea. From that sandbar over there.\"", "\"Did you read it?\"", "\"I didn't open it. You don't open something without its owner's permission.\"", "Rasion's mouth fell open, then slowly closed. Then he started to laugh out loud. A hearty laugh, yet somehow moving.", "\"Ha, are the mermaids in this sea this naive? A pirate who doesn't open a bottle? The old captain would laugh himself to death.\"", "\"The old captain?\"", "\"My old captain. Not around anymore.\"", "A short silence hung at the tail of the laughter. Rasion turned his gaze to the horizon. Nelwin quietly watched his profile. He was smiling, yet his face looked like a door not fully closed.", "\"Hey, come here. I've got something to show you.\"", "The hand he held out was big and rough. Calloused, tattoo winding around it. A hand of the sea above. A hand that said come up, I'll show you the real world up there.", "Nelwin looked at that hand. This hand had a purpose too. He could tell that. This man wanted something, and that was why he had made this meeting. But the strange thing was, knowing it didn't make the hand cold.", "That night, too, Kaeldin came. Without mentioning the day's events, Nelwin rested his chin on the surface as usual. Kaeldin extended his ungloved hand down below the railing and said quietly:", "\"Would you like to come up? I'll show you the stars from the deck.\"", "The second hand was slim, long, and warm. Fingers slightly stiff from turning pages, a small callus from holding a pen. A prince's hand. But it was trembling. Very faintly. Nelwin saw at a glance how carefully he was offering this hand.", "Two hands. One of the sea above, one of the land. One that wanted something without hiding it, one that trembled while hiding.", "Nelwin took neither. Instead he smiled quietly, shook his head, and sank into the water. Beyond the surface he saw Kaeldin's hand slowly withdraw. Putting the glove back on, he moved slower than usual.", "The water felt heavier than usual the whole way back to the deep. After he crossed the palace corridor and descended the stairs, the Hall of the Rite was quiet as ever. The pearl pulsed in a deeper silver than it had days ago. The old woman stood with her cane. She had the look of someone who knew he was coming before his presence even reached her.", "\"Lady Thalassa. Can the heart of someone with a purpose still be real?\"", "The old woman did not answer for a long time.", "\"...Water flows without asking why.\"", "At last Thalassa spoke.", "\"People can't, so before they flow, they make reasons. A reason doesn't make a heart false. The trouble is only when the reason starts to speak before the heart does.\"", "\"Then how do I know? Whether it's the reason talking or the heart?\"", "\"You don't.\"", "The old woman smiled calmly.", "\"That's why choosing is hard. But I'll tell you one thing. If both hands reach for you, look not at the one you take, but at the one you can't let go of.\"", "\"I didn't take either.\"", "\"Then you'll see it better.\"", "Laughter was mixed into her voice. Teasing, or perhaps comforting. Nelwin pouted and left the hall.", "That night he couldn't sleep. He tossed back and forth on his seaweed cushion, then picked up the mirror shard. The face in the mirror was strange. Without a smile or a word, a face like a merman with no name. Behind it, the ceiling lights swayed one by one.", "\"...Nelwin.\"", "Ojingo called from the door. His whole body was lavender.", "\"I'm an octopus, though... even an octopus can see this is dangerous.\"", "\"I know.\"", "\"So what are you going to do?\"", "\"I don't know.\"", "Nelwin put down the mirror shard. After a long while he added quietly:", "\"But I've decided one thing.\"", "\"What?\"", "\"I won't let anyone decide for me.\"", "It felt like Seira's voice was saying it with him in his head. Ojingo looked at him for a long time, then without a word pulled a seaweed blanket over him with one tentacle. The lavender loosened, just a little, toward sky blue.", "Two days later at dawn, Nelwin said the same thing to both of them. First to Kaeldin, below the railing of the royal ship. Then to Rasion, on a broken mast in the wreck waters.", "\"Come to the northern wreck at dawn, five days from now. Let's meet, the three of us.\"", "\"The three of us?\"", "\"Why three? Can't I just meet you alone?\"", "The two asked back at nearly the same moment, with the same expression, in completely different voices. Nelwin gave the same answer both times.", "\"This is a promise I decided with my own mouth. We'll talk about the rest when you get there.\"", "Descending beneath the surface, Nelwin struck the water once with the tip of his tail. His heart was beating loudly. It was the first promise he had ever decided for himself. He had no idea what awaited him, but it was unmistakably his own voice.", "Five days remained until the day of the promise."]}}, {"no": 5, "title": {"ko": "…", "en": "…"}, "cover": "novel/book_bbogeul.png", "body": {"ko": ["9월 15일 새벽, 북쪽 난파 해역에는 안개가 끼어 있었다.", "부서진 거대 범선이 바다 위로 갈비뼈처럼 늑재를 드러내고 누워 있었다. 갑판은 반쯤 기울었고, 꺾인 마스트 사이로 새벽의 첫 빛이 가느다랗게 스며들었다. 파도는 낮게 숨을 쉬듯 선체를 핥고 지나갔다.", "넬윈은 약속보다 먼저 도착해 있었다. 난파선 가장 높은 마스트 조각에 걸터앉아 꼬리지느러미를 흔들었다. 어깨 위에는 작고 말랑한 것이 하나 붙어 있었다.", "\"…넬윈.\"", "\"응, 뽀글아.\"", "\"여기… 춥다…\"", "\"조금만 참아. 곧 올 거야.\"", "뽀글이는 분홍빛 바다달팽이였다. 손바닥만 한 몸에 점처럼 작은 눈 두 개. 말도 느리고 걸음도 느리고 기억은 더 느린데, 이상하게도 넬윈의 기분만은 언제나 가장 먼저 알아챘다. 어젯밤 어징오 몰래 따라와서 아침까지 어깨에 붙어 있었다. 이 얘기를 하면 어징오가 연보라가 되어 달려올 테니 넬윈은 입을 다물기로 했다.", "\"…떨려…?\"", "\"…조금.\"", "\"나도… 조금… 근데… 같이 있으면… 괜찮아…\"", "그 말을 하는 데 한참이 걸렸다. 넬윈은 피식 웃고 손가락 끝으로 뽀글이의 말랑한 등을 쓸어 주었다. 안개가 두 사람 사이를 지나가며 머리카락 끝을 축축하게 적셨다. 아래쪽 어딘가에서 선체가 삐걱거렸다. 오래 가라앉아 있던 나무가 아직 기억을 놓지 못하고 있는 소리 같았다.", "노 젓는 소리가 먼저 들렸다. 안개 속에서 작은 보트 한 척이 나타났다. 노를 젓는 사람은 혼자였다. 플래티넘 블론드의 곱슬머리가 새벽빛을 받아 은빛으로 번졌다. 폴리오도 호위도 없었다.", "\"약속 시각보다 일찍 오셨군요.\"", "\"그쪽이야말로요.\"", "카엘딘이 갑판으로 올라서는 순간, 반대편에서 돛배의 닻이 물을 갈랐다. 붉은 리본이 안개 속에서 먼저 보였다.", "\"오, 왕자님이 혼자 왔네. 서기관은 두고?\"", "\"서기관은 잠들어 있습니다. 깨우지 않고 나왔습니다.\"", "\"대담한데.\"", "\"…들키면 혼날 겁니다.\"", "\"그럼 같이 혼나지 뭐. 이쪽도 부하들 몰래 나왔으니까.\"", "두 사람은 서로를 한 번 훑어보고는 어색하게 시선을 돌렸다. 넬윈은 그 모습이 우스워서 하마터면 웃을 뻔했다. 하지만 웃지 않았다. 이 자리를 만든 사람은 자신이었으니까.", "세 사람은 기울어진 갑판 위에 둥글게 앉았다. 부서진 목재가 의자였다. 어색한 침묵이 안개 사이로 한참 떠돌았다. 파도가 선체에 닿을 때마다 뽀글이가 넬윈의 어깨에 조금씩 더 바짝 붙었다. 먼저 입을 연 것은 카엘딘이었다.", "\"제가 먼저 말씀드리겠습니다.\"", "그는 장갑을 벗어 무릎 위에 올려놓았다.", "\"저는 왕명으로 이 바다에 왔습니다. 옛 혈맹을 되살리라는 명을 받았고, 그 약속은 제 이름으로 해야 한다고 들었습니다. 어젯밤에야 이 약속의 값이 무엇인지 알았습니다.\"", "그는 라시온 쪽을 힐끗 보았다.", "\"다만 오늘 이 자리에 온 것은 왕명이 아니라 제 뜻입니다. 그것만은 분명히 말씀드립니다.\"", "\"…나도 한마디 하지.\"", "라시온이 머리를 긁적이더니 포기한 듯 말했다.", "\"처음엔 이용할 생각이었어. 왕자도, 인어도. 우리 선장님이 죽은 이유를 알아내려면 칼드심해로 가야 했거든. 그러려면 이쪽 인어 한 마리쯤 낚아 두는 게 편했지.\"", "\"알고 있었어요.\"", "넬윈이 조용히 말했다. 두 사람이 동시에 그를 돌아보았다.", "\"두 사람 다 목적이 있다는 거. 나는 알고 있었어요. 모르는 척한 건 아니고, 알면서도 손이 따뜻해서요.\"", "라시온의 입이 벌어졌다가 닫혔다. 카엘딘은 한동안 아무 말도 하지 않았다. 그러다 아주 작게 웃었다. 쓸쓸한 웃음이 아니라 안도에 가까운 웃음이었다.", "\"…그렇군요. 저는 당신께 한 수 졌습니다.\"", "\"그럼 이제 내 차례예요.\"", "넬윈은 무릎을 끌어안았다. 어깨 위의 뽀글이가 말없이 몸을 붙여 왔다.", "\"나는 곧 선택을 해야 해요. 만월 전에. 백 년에 한 번 열리는 문이 있대요. 그 문을 지나면 나는 영영 사람이 될 수 있어요. 대신 가장 아끼는 걸 하나 내놓아야 하고요. 목소리나 기억. 둘 중 하나.\"", "\"…!\"", "\"그런 값을 치러야 하는 줄은 몰랐습니다.\"", "카엘딘이 낮게 말했다. 얼굴이 새하얗게 질려 있었다.", "\"사람이 되는 대가로 목소리나 기억을 내놓는다고요. 누가 그딴 걸 요구해.\"", "라시온의 목소리에서 날라리 같은 가벼움이 완전히 빠져 있었다. 한쪽뿐인 황금빛 눈이 서늘하게 가라앉았다.", "\"…그리고 그걸 지금까지 혼자 안고 있었다는 거야?\"", "\"혼자는 아니었어요. 어징오도 있고 뽀글이도 있고…\"", "\"…나도… 있어…\"", "뽀글이가 느릿하게 덧붙였다. 세 사람의 표정이 한순간 풀렸다. 안개 끝이 아주 조금 밝아졌다. 카엘딘이 먼저 소리 없이 웃었고, 라시온이 뒤늦게 코웃음을 쳤고, 넬윈은 그 사이에서 오랜만에 숨을 깊게 쉬었다.", "수평선이 희미하게 붉어지고 있었다. 새벽이 끝나 가고 있었다. 넬윈은 숨을 크게 들이마셨다. 두 사람의 시선이 동시에 그에게 향했다. 카엘딘의 초록 눈과 라시온의 황금빛 눈. 두 개의 손이 아직 거기 있었다. 하나는 장갑을 벗은 채 무릎 위에, 하나는 굳은살 박인 채 갑판 위에. 어느 쪽도 먼저 뻗지 않았다. 둘 다 그가 정하기를 기다리고 있었다.", "\"저는…\"", "파도 소리가 멎었다.", "바람도, 안개도, 뽀글이의 느린 숨소리도 한꺼번에 멎었다. 마치 누군가 이야기의 책장을 쥐고 멈춰 세운 것처럼.", "\"저는, 제가 정한 건 ▒▒▒▒▒▒\"", "\"▒▒▒ 그 말은 ▒▒▒▒ 들리지 ▒▒▒\"", "\"▒▒▒▒▒▒▒▒▒▒▒▒\"", "그리고 이야기는 거기서 멈췄다."], "en": ["At dawn on September 15, fog hung over the northern wreck waters.", "A huge broken ship lay on the sea, its ribs exposed like a skeleton. The deck was half tilted, and between the snapped masts the first light of dawn seeped in, thin as thread. The waves licked along the hull, breathing low.", "Nelwin had arrived ahead of the appointed time. He sat on the highest piece of mast on the wreck, swinging his tail fin. On his shoulder, something small and soft clung.", "\"...Nelwin.\"", "\"Yeah, Bbogeul.\"", "\"It's... cold here...\"", "\"Just bear it a little longer. They'll be here soon.\"", "Bbogeul was a pink sea snail. A body the size of a palm, two eyes small as dots. Slow of speech, slow of steps, slower still of memory, yet strangely he always noticed Nelwin's mood first. He had followed last night behind Ojingo's back and clung to Nelwin's shoulder until morning. If Nelwin mentioned it, Ojingo would turn lavender and come running, so he decided to keep quiet.", "\"...Nervous...?\"", "\"...A little.\"", "\"Me too... a little... but... when we're together... it's okay...\"", "It took a long time to say that. Nelwin snorted a small laugh and stroked the soft back of the snail with a fingertip. The fog passed between them, dampening the ends of his hair. Somewhere below, the hull creaked. It sounded like old timber that still hadn't let go of its memories after sinking so long.", "The sound of oars came first. Out of the fog, a small boat appeared. The one rowing was alone. Platinum-blond curls shone silver in the dawn light. No Folio, no guards.", "\"You came earlier than the appointed time.\"", "\"So did you.\"", "The moment Kaeldin stepped onto the deck, on the opposite side the anchor of a sailboat cut the water. A red ribbon showed first in the fog.", "\"Oh, the prince came alone. Left the scribe behind?\"", "\"The scribe is asleep. I came out without waking him.\"", "\"Bold.\"", "\"...If I'm found out, I'll be scolded.\"", "\"Then we'll get scolded together. I slipped out on my crew too.\"", "The two looked each other over once and awkwardly looked away. Nelwin found it so funny he nearly laughed. But he didn't. He was the one who had made this gathering.", "The three sat in a circle on the tilted deck. Broken timber was their chairs. An awkward silence drifted in the fog for a long time. Each time a wave touched the hull, Bbogeul pressed a little closer to Nelwin's shoulder. It was Kaeldin who spoke first.", "\"Allow me to speak first.\"", "He took off his gloves and laid them on his knee.", "\"I came to this sea on royal orders. I was told to revive the old blood-pact, and that the promise must be made in my own name. It was only last night that I learned what the price of that promise is.\"", "He glanced at Rasion.", "\"But I came here today not on royal orders, but of my own will. That much I will say plainly.\"", "\"...I'll say a word too.\"", "Rasion scratched his head and, as if giving up, said:", "\"At first I meant to use you. The prince, and the merman. To find out why our captain died, I had to get to Kaldsimhae. For that, hooking one merman on the line seemed convenient.\"", "\"I knew.\"", "Nelwin said quietly. Both turned to look at him at once.", "\"That you both had a purpose. I knew. It's not that I pretended not to. I knew, and the hands were warm anyway.\"", "Rasion's mouth opened and closed. Kaeldin said nothing for a while. Then he gave a very small laugh. Not a lonely laugh. One closer to relief.", "\"...I see. I've lost to you by a move.\"", "\"Then it's my turn now.\"", "Nelwin hugged his knees. Bbogeul on his shoulder pressed against him without a word.", "\"Soon I have to make a choice. Before the full moon. They say there's a door that opens once every hundred years. If I pass through it, I can become human forever. But I have to give up the thing I treasure most. My voice, or my memory. One of the two.\"", "\"...!\"", "\"I did not know such a price had to be paid.\"", "Kaeldin said in a low voice. His face had gone white.", "\"In exchange for becoming human, you give up your voice or your memory. Who demands such a thing?\"", "The easy lightness had completely drained from Rasion's voice. His single golden eye sank cold.", "\"...And you've been carrying that alone this whole time?\"", "\"Not alone. There's Ojingo, and Bbogeul...\"", "\"...Me... too...\"", "Bbogeul added, slowly. The faces of the three loosened for a moment. The edge of the fog grew just slightly brighter. Kaeldin laughed first, without sound, and Rasion snorted late, and between them Nelwin took a deep breath for the first time in a long while.", "The horizon was reddening faintly. The dawn was ending. Nelwin drew a deep breath. The eyes of both turned to him at once. Kaeldin's green eyes and Rasion's golden eye. The two hands were still there. One, glove off, on a knee. One, calloused, on the deck. Neither reached out first. Both were waiting for him to decide.", "\"I...\"", "The sound of the waves stopped.", "The wind, the fog, Bbogeul's slow breathing, all of it stopped together. As if someone had caught the page of the story in their grip and held it still.", "\"I, what I decided is ▒▒▒▒▒▒\"", "\"▒▒▒ those words ▒▒▒▒ can't be heard ▒▒▒\"", "\"▒▒▒▒▒▒▒▒▒▒▒▒\"", "And the story stopped there."]}, "err": true}];
